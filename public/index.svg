      <header data-standard="CCSS.MATH.PRACTICE.MP1" data-matrix="" style="border-bottom:1px solid #27272a;padding-bottom:16px;margin-bottom:24px;">
        <h1 style="margin:0;font-size:1.5rem;color:#fafafa;">ScholarPath Academy — Standards-Aligned Mathematics Curriculum</h1>
        <p style="margin:6px 0 0;color:#a1a1aa;font-size:0.95rem;">Loading interactive problem sets, graphing modules, and mastery diagnostics...</p>
      </header>
      <section data-standard="CCSS.MATH.CONTENT.HSA.REI.B.4" data-matrix="" style="margin-bottom:20px;">
        <h2 style="font-size:1.1rem;color:#e4e4e7;">Unit 1: Linear Systems, Quadratics &amp; Polynomial Functions</h2>
        <p>Guided problem sets covering Gaussian elimination, complex roots, discriminant analysis, rational asymptotes, and binomial expansion for grades 8–12.</p>
      </section>
      <section data-standard="CCSS.MATH.CONTENT.HSF.TF.A.3" data-matrix="" style="margin-bottom:20px;">
        <h2 style="font-size:1.1rem;color:#e4e4e7;">Unit 2: Analytic Trigonometry &amp; Conic Sections</h2>
        <p>Unit circle periodicity, Law of Sines and Cosines, polar coordinate transformations, parametric vectors, and eccentricity of ellipses and hyperbolas.</p>
      </section>
      <section data-standard="CCSS.MATH.CONTENT.HSN.VM.C.8" data-matrix="" style="margin-bottom:20px;">
        <h2 style="font-size:1.1rem;color:#e4e4e7;">Unit 3: Differential &amp; Integral Calculus</h2>
        <p>Limits and continuity, chain rule optimization, related rates, Riemann sums, Fundamental Theorem of Calculus, and differential equations.</p>
      </section>
      <section data-standard="CCSS.MATH.CONTENT.HSS.ID.B.6" data-matrix="">
        <h2 style="font-size:1.1rem;color:#e4e4e7;">Unit 4: Probability Distributions &amp; Statistical Inference</h2>
        <p>Combinatorics, random variables, normal and binomial distributions, confidence intervals, chi-square goodness-of-fit, and least-squares regression.</p>
      </section>
